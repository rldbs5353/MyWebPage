<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="컴퓨터공학 전공 남학생 일러스트">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <!-- background code snippets -->
    <g font-family="Consolas, monospace" font-size="18" fill="#93c5fd">
      <text x="34" y="78">import torch</text>
      <text x="262" y="112">def train():</text>
      <text x="22" y="150">#include</text>
      <text x="292" y="176">{ }</text>
    </g>
    <!-- body / hoodie -->
    <path d="M70 400 C70 315 120 280 200 280 C280 280 330 315 330 400 Z" fill="#1e3a8a"/>
    <path d="M160 284 L200 330 L240 284 Z" fill="#172554"/>
    <path d="M178 300 L178 350 M222 300 L222 350" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
    <!-- neck -->
    <rect x="180" y="242" width="40" height="44" rx="12" fill="#f1c7a3"/>
    <!-- head -->
    <ellipse cx="200" cy="190" rx="70" ry="78" fill="#f6d2b3"/>
    <!-- ears -->
    <ellipse cx="130" cy="196" rx="12" ry="18" fill="#f1c7a3"/>
    <ellipse cx="270" cy="196" rx="12" ry="18" fill="#f1c7a3"/>
    <!-- hair -->
    <path d="M128 182 C122 120 160 100 200 100 C246 100 282 122 274 184 C266 160 252 146 236 140 C214 152 172 150 150 140 C138 150 132 164 128 182 Z" fill="#1f2937"/>
    <path d="M150 140 C170 128 196 126 214 134 C200 146 172 150 150 140 Z" fill="#111827"/>
    <!-- eyebrows -->
    <path d="M160 174 Q174 167 188 173" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M212 173 Q226 167 240 174" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- glasses -->
    <g fill="none" stroke="#111827" stroke-width="4.5">
      <rect x="150" y="182" width="44" height="34" rx="10"/>
      <rect x="206" y="182" width="44" height="34" rx="10"/>
      <path d="M194 196 Q200 191 206 196"/>
      <path d="M150 194 L134 190 M250 194 L266 190"/>
    </g>
    <!-- eyes -->
    <circle cx="172" cy="199" r="5" fill="#111827"/>
    <circle cx="228" cy="199" r="5" fill="#111827"/>
    <!-- nose & mouth -->
    <path d="M200 206 Q196 222 204 224" stroke="#d9a47f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M182 238 Q200 252 218 238" stroke="#9a3412" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- laptop -->
    <path d="M110 372 L130 318 L270 318 L290 372 Z" fill="#9ca3af"/>
    <path d="M118 366 L135 324 L265 324 L282 366 Z" fill="#374151"/>
    <rect x="96" y="370" width="208" height="14" rx="6" fill="#6b7280"/>
    <text x="200" y="354" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#60a5fa">&lt;/&gt;</text>
  </g>
</svg>
