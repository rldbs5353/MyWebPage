          url: "https://www.jbnu.ac.kr"
        date: "2023 - 현재"
        content: |-
          2학년 재학 중 (학번 202322980)
          - 주요 수강: 확률및통계, 기초프로젝트, 객체지향프로그래밍, 리눅스프로그래밍, 알고리즘, 컴퓨터구조

