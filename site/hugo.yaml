  # About
  about:
    enable: true
    title: "자기소개"
    image: "/images/profile.svg"
    content: |-
      저는 **전북대학교 컴퓨터인공지능학부 2학년** 엄기윤입니다.
      가장 관심 있는 분야는 **인공지능**이며, 특히 머신러닝 모델이 데이터로부터 어떻게 학습하는지, 그리고 그것을 실제 문제에 어떻게 적용할 수 있는지에 관심이 많습니다.

      **관심 분야**
      - 머신러닝 · 딥러닝 기초
      - 실생활에 쓰이는 AI 서비스 (컴퓨터 비전, 자연어 처리)

      **관심을 갖게 된 이유**
      AI 시대가 앞으로 **얼마나 더 발전할 수 있을지** 궁금했습니다. 그 답을 직접 확인해 보고 싶어서, AI를 배우는 데서 그치지 않고 AI로 실제 서비스를 만들어 보고 있습니다.

      **학습 목표와 실행 계획**
      - **목표 1. AI에 필요한 수학 기초 다지기**
        → 이번 학기 *확률및통계* 수업 내용을 매주 정리하고, 배운 개념(확률분포, 회귀 등)을 Python 코드로 직접 구현해 보기
      - **목표 2. 하나의 AI 서비스를 배포까지 완성하기**
        → AI Agent Challenge에서 만든 *리뷰 매니저 AI*의 한계였던 "브라우저에만 저장되는 기록"을 서버 저장 방식으로 바꾸는 개선 작업 진행하기
    skills:
      enable: true
      title: "다룰 수 있는 기술과 실제 사용 사례:"
      items:
        - "**Python · C** — 알고리즘 과제와 리눅스 프로그래밍 과제에서 사용 중"
        - "**Claude Code (AI 코딩 에이전트)** — AI Agent Challenge에서 *리뷰 매니저 AI* 개발에 활용"
        - "**Git / GitHub · Hugo** — 이 포트폴리오 사이트를 만들고 GitHub Actions로 자동 배포"

