          I am most interested in **Artificial Intelligence**, especially how machine learning models learn from data and how they can be applied to real-world problems.

          **Interests**
          - Machine learning and deep learning fundamentals
          - Practical AI services (computer vision, natural language processing)

          **Why I'm interested**
          I've been curious about **how far the age of AI can go**. To see it for myself, I'm not just studying AI but also building real services with it.

          **Learning goals and action plan**
          - **Goal 1. Build the math foundation for AI**
            → Summarize my *Probability and Statistics* class every week and implement the concepts (distributions, regression, etc.) in Python myself
          - **Goal 2. Finish one AI service all the way to deployment**
            → Improve *Review Manager AI* from the AI Agent Challenge by moving its browser-only history to server-side storage
