    title: "Kiyun Eom"
    menu:
      main:
        - identifier: blog
          name: Activities
          title: Activity posts
          url: /en/blogs
          weight: 1
    params:
      description: "Portfolio of Kiyun Eom, a sophomore in Computer Science and Artificial Intelligence at Jeonbuk National University"
      navbar:
        brandName: "Kiyun Eom"
        searchPlaceholder: "Search..."
      hero:
        intro: "Hi, my name is"
        title: "Kiyun Eom."
        subtitle: "I'm learning to build AI that helps people."
        content: "A sophomore in the Division of Computer Science and Artificial Intelligence at Jeonbuk National University (Student ID 202322980). I'm building my computing fundamentals with Python and C."
        button:
          name: "View Activities"
          url: "/en/blogs"
      about:
        title: "About Me"
        content: |-
          I am a sophomore in the **Division of Computer Science and Artificial Intelligence at Jeonbuk National University**.
          I am most interested in **Artificial Intelligence**, especially how machine learning models learn from data and how they can be applied to real-world problems.

          **Interests**
          - Machine learning and deep learning fundamentals
          - Practical AI services (computer vision, natural language processing)

          **Learning goals**
          - Build a solid foundation in linear algebra, probability, and statistics for AI
          - Complete at least one AI project from data collection to deployment
        skills:
          title: "Technologies I've been working with:"
          items:
            - "Python"
            - "C"
            - "Git / GitHub"
            - "Hugo (static site)"
      education:
        title: "Education"
        items:
          - title: "B.S. in Computer Science and Artificial Intelligence"
            school:
              name: "Jeonbuk National University"
              url: "https://www.jbnu.ac.kr"
            date: "2023 - present"
            content: |-
              Currently a sophomore (Student ID 202322980).
              - Main coursework: Probability and Statistics, Basic Project, Object-Oriented Programming, Linux Programming, Algorithms, Computer Architecture
      projects:
        title: "Projects"
        items:
          - title: "2026 AI Agent Challenge"
            content: "A summer camp project by NAVER Connect Foundation and SNU. I planned and developed the web page for our team's AI agent service and presented it at Demo Day."
            image: /images/projects/ai-agent-challenge.png
            featured:
              name: "Details"
              link: /en/blogs/ai-agent-challenge/
            badges:
              - "AI Agent"
              - "Web"
              - "Team Project"
          - title: "Hugo Portfolio Site"
            content: "This website. Built with the Hugo Profile theme and automatically deployed to GitHub Pages using GitHub Actions."
            image: /images/projects/portfolio.svg
            featured:
              name: "Details"
              link: /en/blogs/portfolio-site/
            badges:
              - "Hugo"
              - "GitHub Actions"
              - "GitHub Pages"
            links:
              - icon: fab fa-github
                url: https://github.com/rldbs5353/MyWebPage
      contact:
        title: "Contact"
        content: "Feel free to contact me about AI, study groups, or projects. I'll get back to you as soon as possible!"
        btnName: "Send Email"
      footer:
        recentPosts:
          title: "Recent Posts"
      singlePages:
        readTime:
          content: "min read"
      terms:
        read: "Read"
        toc: "Table Of Contents"
        copyright: "All rights reserved"
        emailText: "Check out this site"

