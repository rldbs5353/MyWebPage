    image: "/images/profile.svg"
    content: |-
      저는 **전북대학교 컴퓨터인공지능학부 2학년** 엄기윤입니다.
      가장 관심 있는 분야는 **인공지능**이며, 특히 머신러닝 모델이 데이터로부터 어떻게 학습하는지, 그리고 그것을 실제 문제에 어떻게 적용할 수 있는지에 관심이 많습니다.

      **관심 분야**
      - 머신러닝 · 딥러닝 기초
      - 실생활에 쓰이는 AI 서비스 (컴퓨터 비전, 자연어 처리)

      **학습 목표**
      - AI에 필요한 선형대수 · 확률 · 통계 기초 탄탄히 다지기
      - 데이터 수집부터 배포까지 하나의 AI 프로젝트를 끝까지 완성하기
    skills:
      enable: true
      title: "다룰 수 있는 기술:"
      items:
        - "Python"
        - "C"
        - "Git / GitHub"
        - "Hugo (정적 사이트)"

